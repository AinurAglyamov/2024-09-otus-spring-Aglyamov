services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5444/online_school_db
      - SPRING_DATASOURCE_USERNAME=local
      - SPRING_DATASOURCE_PASSWORD=local
  postgres:
    image: "postgres:16-alpine3.21"
    ports:
      - "5444:5432"
    environment:
      - POSTGRES_USER=local
      - POSTGRES_PASSWORD=local
      - POSTGRES_DB=online_school_db
